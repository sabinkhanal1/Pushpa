<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Journey ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #101522;
  color: white;
  font-family: Georgia, serif;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#78c9f5, #d8e9c0 48%, #548b54);
}

#scene {
  width: 100%;
  height: 100%;
  display: block;
}

#hud {
  position: absolute;
  top: 18px;
  left: 0;
  width: 100%;
  text-align: center;
  font-size: 18px;
  text-shadow: 0 2px 5px #333;
  pointer-events: none;
}

#message {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  text-align: center;
  background: #101522bb;
  padding: 24px;
}

.panel {
  max-width: 520px;
  padding: 35px;
  border: 1px solid #ffffff66;
  border-radius: 24px;
  background: #18233deF;
  box-shadow: 0 15px 60px #0008;
}

h1 {
  font-size: clamp(28px, 6vw, 48px);
  margin-bottom: 18px;
}

p {
  line-height: 1.7;
  margin-bottom: 20px;
}

button {
  background: #ff477e;
  color: white;
  border: none;
  padding: 14px 28px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  background: #ff75a0;
}

#controls {
  position: absolute;
  bottom: 22px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 20px;
}

#controls button {
  background: #17243dcc;
  border: 1px solid white;
  width: 65px;
  height: 55px;
  padding: 0;
  font-size: 25px;
}

.hidden {
  display: none !important;
}

#ending {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: linear-gradient(#25132beF, #5a2349ee);
  padding: 20px;
}

.ending-content {
  max-width: 650px;
}

#ending h1 {
  color: #ffb7d0;
}

#ending img {
  width: min(150px, 30vw);
  height: 180px;
  object-fit: contain;
  margin: 8px;
}

@media (max-width: 600px) {
  #hud { font-size: 15px; }
  .panel { padding: 24px; }
}
</style>
</head>

<body>
<div id="game">
  <canvas id="scene"></canvas>

  <div id="hud">❤️ Our Journey · <span id="distance">0</span> m</div>

  <div id="message">
    <div class="panel">
      <h1>Our Little Journey ❤️</h1>
      <p>A beautiful road, two little cars, and one special destination.</p>
      <p>Drive carefully. Someone special is following you. 🌸</p>
      <button id="start">Start Our Journey</button>
    </div>
  </div>

  <div id="controls" class="hidden">
    <button id="left">←</button>
    <button id="right">→</button>
  </div>

  <div id="ending">
    <div class="ending-content">
      <h1>Will You Be Mine? ❤️</h1>
      <p>Every road feels beautiful when I imagine travelling it with you.</p>
      <img id="proposalBoy" src="characters/boy-proposal-kneeling.png" alt="Boy proposing">
      <img id="proposalGirl" src="characters/girl-receiving-flowers.png" alt="Girl receiving flowers">
      <p id="answer">You make my world more beautiful. 🌹</p>
      <button id="yes">YES ❤️</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");

let width, height;
let running = false;
let distance = 0;
let roadOffset = 0;
let playerX = 0;
let ending = false;
let lastTime = 0;
let keys = { left: false, right: false };

const sprites = {};
const spriteNames = [
  "boy-standing",
  "boy-walking",
  "boy-with-flowers",
  "boy-proposal-kneeling",
  "girl-standing",
  "girl-walking",
  "girl-receiving-flowers",
  "girl-open-arms"
];

spriteNames.forEach(name => {
  const img = new Image();
  img.src = `characters/${name}.png`;
  sprites[name] = img;
});

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function drawCar(x, y, color, isPlayer = false) {
  ctx.save();
  ctx.translate(x, y);

  // Shadow
  ctx.fillStyle = "#17201788";
  ctx.beginPath();
  ctx.ellipse(0, 30, 43, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // Wheels
  ctx.fillStyle = "#171717";
  ctx.fillRect(-36, -3, 12, 28);
  ctx.fillRect(24, -3, 12, 28);

  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(-43, -17, 86, 40, 13);
  ctx.fill();

  // Windows
  ctx.fillStyle = "#bce9f7";
  ctx.beginPath();
  ctx.roundRect(-22, -30, 44, 25, 9);
  ctx.fill();

  // Lights
  ctx.fillStyle = "#fff7b0";
  ctx.fillRect(-41, -11, 7, 9);
  ctx.fillStyle = "#ff394b";
  ctx.fillRect(35, -11, 7, 9);

  ctx.restore();
}

function drawScenery() {
  ctx.clearRect(0, 0, width, height);

  // Sky
  let sky = ctx.createLinearGradient(0, 0, 0, height);
  sky.addColorStop(0, "#69bff2");
  sky.addColorStop(0.65, "#d5edbd");
  sky.addColorStop(1, "#6b9d55");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, width, height);

  // Sun
  ctx.fillStyle = "#fff2a6";
  ctx.beginPath();
  ctx.arc(width * 0.8, height * 0.17, 42, 0, Math.PI * 2);
  ctx.fill();

  // Mountains
  ctx.fillStyle = "#638c78";
  ctx.beginPath();
  ctx.moveTo(0, height * 0.48);
  ctx.lineTo(width * 0.2, height * 0.22);
  ctx.lineTo(width * 0.43, height * 0.48);
  ctx.lineTo(width * 0.7, height * 0.2);
  ctx.lineTo(width, height * 0.48);
  ctx.fill();

  // Grass
  ctx.fillStyle = "#60964d";
  ctx.fillRect(0, height * 0.48, width, height);

  // Road
  const roadWidth = Math.min(width * 0.65, 600);
  const roadLeft = width / 2 - roadWidth / 2;
  ctx.fillStyle = "#555b65";
  ctx.fillRect(roadLeft, height * 0.47, roadWidth, height * 0.53);

  // Road edges
  ctx.fillStyle = "#f8f1d4";
  ctx.fillRect(roadLeft, height * 0.47, 7, height * 0.53);
  ctx.fillRect(roadLeft + roadWidth - 7, height * 0.47, 7, height * 0.53);

  // Moving road markings
  ctx.strokeStyle = "#fff1be";
  ctx.lineWidth = 6;
  ctx.setLineDash([35, 35]);
  ctx.lineDashOffset = -roadOffset;
  ctx.beginPath();
  ctx.moveTo(width / 2, height * 0.48);
  ctx.lineTo(width / 2, height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Trees
  for (let i = 0; i < 10; i++) {
    const y = height * 0.49 + ((i * 95 + roadOffset * 1.4) % (height * 0.5));
    const side = i % 2 === 0 ? -1 : 1;
    const x = width / 2 + side * (roadWidth * 0.55 + 35 + (i % 3) * 22);

    ctx.fillStyle = "#684b34";
    ctx.fillRect(x - 5, y - 35, 10, 42);
    ctx.fillStyle = i % 2 ? "#236b40" : "#31834c";
    ctx.beginPath();
    ctx.arc(x, y - 42, 25, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawCharacters() {
  const boy = sprites["boy-standing"];
  const girl = sprites["girl-standing"];

  // Boy and girl following in separate cars
  drawCar(width / 2 + playerX, height * 0.79, "#ed3157", true);
  drawCar(width / 2 + 100, height * 0.65, "#268de0");

  // Character sprites in cars
  if (boy.complete && boy.naturalWidth) {
    ctx.drawImage(boy, width / 2 + playerX - 22, height * 0.79 - 58, 44, 48);
  }
  if (girl.complete && girl.naturalWidth) {
    ctx.drawImage(girl, width / 2 + 100 - 22, height * 0.65 - 58, 44, 48);
  }
}

function draw() {
  drawScenery();
  drawCharacters();
}

function update(time) {
  if (!running) return;

  const delta = Math.min((time - lastTime) / 16.67 || 1, 2);
  lastTime = time;

  if (!ending) {
    if (keys.left) playerX -= 4 * delta;
    if (keys.right) playerX += 4 * delta;

    playerX = Math.max(-width * 0.2, Math.min(width * 0.2, playerX));

    distance += 0.7 * delta;
    roadOffset = (roadOffset + 4 * delta) % 70;

    document.getElementById("distance").textContent = Math.floor(distance);

    if (distance >= 700) {
      finishJourney();
    }
  }

  draw();
  requestAnimationFrame(update);
}

function finishJourney() {
  if (ending) return;
  ending = true;
  document.getElementById("controls").classList.add("hidden");
  document.getElementById("ending").style.display = "flex";
}

document.getElementById("start").addEventListener("click", () => {
  document.getElementById("message").classList.add("hidden");
  document.getElementById("controls").classList.remove("hidden");
  running = true;
  lastTime = performance.now();
  requestAnimationFrame(update);
});

document.getElementById("yes").addEventListener("click", () => {
  document.getElementById("ending").innerHTML = `
    <div class="ending-content">
      <h1>She Said YES! ❤️</h1>
      <p>And the best journey is the one we take together.</p>
      <h1>Forever & Always 🌹</h1>
      <p>With love, from your Sabin.</p>
    </div>`;
});

function setKey(key, value) {
  keys[key] = value;
}

document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") setKey("left", true);
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") setKey("right", true);
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") setKey("left", false);
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") setKey("right", false);
});

["left", "right"].forEach(key => {
  const button = document.getElementById(key);
  button.addEventListener("pointerdown", () => setKey(key, true));
  button.addEventListener("pointerup", () => setKey(key, false));
  button.addEventListener("pointerleave", () => setKey(key, false));
  button.addEventListener("pointercancel", () => setKey(key, false));
});

draw();
</script>
</body>
</html>
